<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa Mundi de Empresas - Directorio Oficial</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    #map {
      height: 100%;
      width: 100%;
      background-color: #0b132b;
    }

    /* Popups Estilizados */
    .leaflet-popup-content-wrapper {
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6);
      padding: 0;
      overflow: hidden;
    }

    .leaflet-popup-content {
      margin: 0;
      width: 290px !important;
    }

    .leaflet-popup-tip {
      background: #0f172a;
      border: 1px solid #334155;
    }

    /* Marcadores Animados */
    .custom-marker {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .marker-pin {
      width: 32px;
      height: 32px;
      border-radius: 50% 50% 50% 0;
      position: absolute;
      transform: rotate(-45deg);
      left: 50%;
      top: 50%;
      margin: -20px 0 0 -16px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #ffffff;
    }

    .pulse-ring {
      border: 3px solid currentColor;
      border-radius: 50%;
      height: 48px;
      width: 48px;
      position: absolute;
      left: -8px;
      top: -28px;
      animation: pulsate 1.8s ease-out infinite;
      opacity: 0;
    }

    @keyframes pulsate {
      0% { transform: scale(0.1); opacity: 0.0; }
      50% { opacity: 0.8; }
      100% { transform: scale(1.3); opacity: 0.0; }
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col md:flex-row overflow-hidden font-sans">

  <!-- Panel Lateral / Leyenda -->
  <aside class="w-full md:w-80 lg:w-96 bg-slate-900 border-r border-slate-800 flex flex-col z-20 shadow-2xl flex-shrink-0">
    <!-- Encabezado -->
    <div class="p-5 border-b border-slate-800 flex items-center space-x-3 bg-slate-900/50 backdrop-blur">
      <div class="p-2.5 bg-blue-600/20 text-blue-400 rounded-xl border border-blue-500/30">
        <i data-lucide="globe" class="w-6 h-6"></i>
      </div>
      <div>
        <h1 class="font-bold text-lg text-white leading-tight">Mapa Mundi</h1>
        <p class="text-xs text-slate-400">Directorio de Empresas Oficiales</p>
      </div>
    </div>

    <!-- Enlaces Directos al Mapa (5 Links) -->
    <div class="p-4 border-b border-slate-800 bg-slate-950/40">
      <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-2">Enlaces Directos al Mapa:</p>
      <div class="space-y-1.5 text-xs">
        <a href="#company-1" onclick="irAEmpresa(1)" class="flex items-center space-x-1.5 text-amber-400 hover:text-amber-300 transition">
          <i data-lucide="arrow-right-circle" class="w-3.5 h-3.5"></i>
          <span>1. Carry1st (África)</span>
        </a>
        <a href="#company-2" onclick="irAEmpresa(2)" class="flex items-center space-x-1.5 text-blue-400 hover:text-blue-300 transition">
          <i data-lucide="arrow-right-circle" class="w-3.5 h-3.5"></i>
          <span>2. Go Disco (EE. UU.)</span>
        </a>
        <a href="#company-3" onclick="irAEmpresa(3)" class="flex items-center space-x-1.5 text-emerald-400 hover:text-emerald-300 transition">
          <i data-lucide="arrow-right-circle" class="w-3.5 h-3.5"></i>
          <span>3. Pungo (Canadá)</span>
        </a>
        <a href="#company-4" onclick="irAEmpresa(4)" class="flex items-center space-x-1.5 text-pink-400 hover:text-pink-300 transition">
          <i data-lucide="arrow-right-circle" class="w-3.5 h-3.5"></i>
          <span>4. Friendsurance (Alemania)</span>
        </a>
        <a href="#company-5" onclick="irAEmpresa(5)" class="flex items-center space-x-1.5 text-purple-400 hover:text-purple-300 transition">
          <i data-lucide="arrow-right-circle" class="w-3.5 h-3.5"></i>
          <span>5. Digicoop (Francia)</span>
        </a>
      </div>
    </div>

    <!-- Lista Interactiva -->
    <div class="p-4 flex-1 overflow-y-auto space-y-3" id="company-list"></div>

    <!-- Botón Reset -->
    <div class="p-4 border-t border-slate-800 bg-slate-900/80">
      <button id="reset-btn" class="w-full py-2.5 px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium rounded-xl transition flex items-center justify-center space-x-2 text-sm border border-slate-700">
        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
        <span>Restablecer Vista Global</span>
      </button>
    </div>
  </aside>

  <!-- Mapa -->
  <main class="flex-1 h-full relative">
    <div id="map"></div>
    
    <div class="hidden lg:flex absolute top-4 left-14 bg-slate-900/80 backdrop-blur border border-slate-800 px-4 py-2.5 rounded-xl z-[1000] items-center space-x-3 text-xs text-slate-300 shadow-lg">
      <span class="flex h-2 w-2 rounded-full bg-emerald-500 animate-ping"></span>
      <span>Haz clic en una empresa para volar a su ubicación y ver su sitio web oficial</span>
    </div>
  </main>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script>
    lucide.createIcons();

    // Datos de las 5 empresas reales con sus respectivas URLs oficiales
    const companies = [
      {
        id: 1,
        name: "Carry1st",
        region: "Ciudad del Cabo, Sudáfrica",
        lat: -33.9249,
        lng: 18.4241,
        icon: "gamepad-2",
        description: "Editorial y plataforma líder de juegos móviles en África.",
        color: "#f59e0b",
        website: "https://www.carry1st.com"
      },
      {
        id: 2,
        name: "Go Disco",
        region: "San Francisco, CA, EE. UU.",
        lat: 37.7749,
        lng: -122.4194,
        icon: "sparkles",
        description: "Plataforma de eventos locales y experiencias sociales.",
        color: "#3b82f6",
        website: "https://www.disco.co/about-disco"
      },
      {
        id: 3,
        name: "Pungo",
        region: "Ottawa, Canadá",
        lat: 45.4215,
        lng: -75.6972,
        icon: "zap",
        description: "Soluciones de tecnología e innovación digital.",
        color: "#10b981",
        website: "https://www.pungo.ca"
      },
      {
        id: 4,
        name: "Friendsurance",
        region: "Berlín, Alemania",
        lat: 52.5200,
        lng: 13.4050,
        icon: "shield-check",
        description: "Pionero en seguros entre pares (Peer-to-Peer Insurance).",
        color: "#ec4899",
        website: "https://www.friendsurance.com"
      },
      {
        id: 5,
        name: "Digicoop",
        region: "París, Francia",
        lat: 48.8566,
        lng: 2.3522,
        icon: "code-2",
        description: "Cooperativa de desarrollo de software libre e interconectado.",
        color: "#8b5cf6",
        website: "https://digicoop.io/en/"
      }
    ];

    const bounds = L.latLngBounds(L.latLng(-85, -180), L.latLng(85, 180));

    const map = L.map('map', {
      center: [20, 0],
      zoom: 2.5,
      minZoom: 2,
      maxZoom: 18,
      maxBounds: bounds,
      maxBoundsViscosity: 1.0,
      zoomControl: false
    });

    L.control.zoom({ position: 'topright' }).addTo(map);

    // Capa Satelital Híbrida
    const esriSatellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Imagery &copy; Esri', maxZoom: 18, noWrap: true, bounds: bounds });
    const esriLabels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { attribution: 'Labels &copy; Esri', maxZoom: 18, noWrap: true });
    
    L.layerGroup([esriSatellite, esriLabels]).addTo(map);

    const markers = {};

    companies.forEach(company => {
      const customIcon = L.divIcon({
        className: 'custom-marker',
        html: `<div class="pulse-ring" style="color: ${company.color}"></div><div class="marker-pin" style="background-color: ${company.color}"></div>`,
        iconSize: [32, 42],
        iconAnchor: [16, 42],
        popupAnchor: [0, -38]
      });

      const marker = L.marker([company.lat, company.lng], { icon: customIcon }).addTo(map);

      const popupContent = `
        <div class="flex flex-col">
          <div class="h-2 w-full" style="background-color: ${company.color}"></div>
          <div class="p-4">
            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full uppercase bg-slate-800 border border-slate-700" style="color: ${company.color}">
              ${company.region}
            </span>
            <h3 class="font-bold text-base text-white mt-2">${company.name}</h3>
            <p class="text-xs text-slate-300 mt-1 leading-relaxed">${company.description}</p>
            
            <div class="mt-4 pt-3 border-t border-slate-800 flex flex-col gap-2">
              <a href="${company.website}" target="_blank" rel="noopener noreferrer" 
                 class="w-full py-2 px-3 bg-blue-600 hover:bg-blue-500 text-white font-medium text-xs rounded-lg transition flex items-center justify-center space-x-1.5 shadow-md">
                <span>Visitar Sitio Web Oficial</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
              </a>
              <a href="https://www.google.com/maps/search/?api=1&query=${company.lat},${company.lng}" target="_blank" class="text-[11px] text-slate-400 hover:text-slate-200 text-center flex items-center justify-center gap-1">
                <span>Ver en Google Maps</span>
              </a>
            </div>
          </div>
        </div>
      `;

      marker.bindPopup(popupContent);
      markers[company.id] = marker;
    });

    // Función de navegación hacia cada empresa
    function irAEmpresa(id) {
      const company = companies.find(c => c.id === id);
      if (!company) return;

      map.flyTo([company.lat, company.lng], 13, {
        duration: 2.2,
        easeLinearity: 0.25
      });

      setTimeout(() => {
        markers[company.id].openPopup();
      }, 2200);

      document.querySelectorAll('#company-list button').forEach(b => {
        b.classList.remove('border-blue-500', 'bg-slate-800');
      });
      const activeBtn = document.getElementById(`btn-${company.id}`);
      if (activeBtn) activeBtn.classList.add('border-blue-500', 'bg-slate-800');
    }

    // Generar botones en el panel lateral
    const companyListContainer = document.getElementById('company-list');
    companies.forEach(company => {
      const btn = document.createElement('button');
      btn.className = `w-full text-left p-3.5 rounded-xl bg-slate-800/40 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 transition duration-200 group flex items-start space-x-3 focus:outline-none`;
      btn.id = `btn-${company.id}`;

      btn.innerHTML = `
        <div class="p-2 rounded-lg bg-slate-900 border border-slate-700/50 group-hover:border-slate-600 transition flex-shrink-0 mt-0.5" style="color: ${company.color}">
          <i data-lucide="${company.icon}" class="w-5 h-5"></i>
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center justify-between">
            <h2 class="font-semibold text-sm text-slate-100 group-hover:text-white truncate">${company.name}</h2>
            <i data-lucide="chevron-right" class="w-4 h-4 text-slate-500 group-hover:text-slate-300 transition group-hover:translate-x-0.5"></i>
          </div>
          <p class="text-xs text-slate-400 mt-0.5">${company.region}</p>
        </div>
      `;

      btn.addEventListener('click', () => irAEmpresa(company.id));
      companyListContainer.appendChild(btn);
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
      map.closePopup();
      map.flyTo([20, 0], 2.5, { duration: 1.8 });
      document.querySelectorAll('#company-list button').forEach(b => {
        b.classList.remove('border-blue-500', 'bg-slate-800');
      });
    });

    lucide.createIcons();
  </script>
</body>
</html>
